  statType: BaseStats.CycleTime
  value: 0.8

Items.PreemBarrelModTurbo:
  $base: Items.SimpleWeaponMod01
  placementSlots: [AttachmentSlots.PreemBarrelMod01, AttachmentSlots.PreemBarrelMod02]
  statModifiers: [Items.PreemBarrelModTurbo_inline1]

Items.PreemBarrelModAtomizer:
  $base: Items.SimpleWeaponMod01
  placementSlots: [AttachmentSlots.PreemBarrelMod01, AttachmentSlots.PreemBarrelMod02]
  statModifiers: []

Items.PreemBarrelModSilencer_inline1:
