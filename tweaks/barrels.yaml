Items.PreemBarrelModSilencer_inline2:
  $base: Items.w_silencer_01_inline1

Items.PreemBarrelModSilencer_inline3:
  $base: Items.SilencerBase_inline0

Items.PreemBarrelModSilencer_inline4:
  $base: Items.SilencerBase_inline1

Items.PreemBarrelModSilencer:
  $base: Items.SilencerBase
  placementSlots: [AttachmentSlots.PreemBarrelMod01, AttachmentSlots.PreemBarrelMod02]
  statModifiers: [Items.PreemBarrelModSilencer_inline1, Items.PreemBarrelModSilencer_inline2, Items.PreemBarrelModSilencer_inline3, Items.PreemBarrelModSilencer_inline4]

# The Silencer's hidden muzzle part (ADR 0002): no stats (they are on the Silencer itself); it only
# sits in the muzzle slot so the game plays the weapon's silenced sound set. Installed and removed
# with the Silencer by PreemCraftingSystem.ApplyModList. Not an airdrop reward.
Items.PreemSilencerMuzzle:
  $base: Items.SilencerBase
  placementSlots: [AttachmentSlots.PowerModule]
  statModifiers: []
  statModifierGroups: []
  tags: [itemPart, WeaponMod, Silenced]

