# Preem barrel mods (except Smart, Tech and Power, which add vanilla stat lists) and their stat
# records. Each mod is a copy of a vanilla weapon mod with Preem placement slots and its own stats;
# each stat record is a copy of a vanilla one with the stat type and value replaced.

Items.PreemBarrelModExtraBarrel_inline1:
  $base: Items.HitmanNovaWeaponMod_inline0
  statType: BaseStats.NumShotsToFire
  value: 2.0

Items.PreemBarrelModExtraBarrel_inline3:
  $base: Items.HitmanNovaWeaponMod_inline0
  statType: BaseStats.ProjectilesPerShot
  value: 2.0

Items.PreemBarrelModExtraBarrel_inline4:
  $base: Items.HitmanNovaWeaponMod_inline0
  statType: BaseStats.Recoil
  value: 2.0

# The game works damage per pellet out as DPS / pellets per second, so twice the pellets alone
# halves each one; twice the DPS keeps every pellet at full damage (decisions log 2026-10-27).
Items.PreemBarrelModExtraBarrel_inline5:
  $base: Items.HitmanNovaWeaponMod_inline0
  statType: BaseStats.DPS
  value: 2.0

Items.PreemBarrelModExtraBarrel:
  $base: Items.SimpleWeaponMod01
  placementSlots: [AttachmentSlots.PreemBarrelMod01, AttachmentSlots.PreemBarrelMod02]
  statModifiers: [Items.PreemBarrelModExtraBarrel_inline1, Items.PreemBarrelModExtraBarrel_inline3, Items.PreemBarrelModExtraBarrel_inline4, Items.PreemBarrelModExtraBarrel_inline5]

Items.PreemBarrelModRecoil_inline2:
  $base: Items.Base_Kyubi_Constant_Stats_inline6
  statType: BaseStats.RecoilPercentBonus
  value: 0.4

Items.PreemBarrelModRecoil:
  $base: Items.SimpleWeaponMod01
  placementSlots: [AttachmentSlots.PreemBarrelMod01, AttachmentSlots.PreemBarrelMod02]
  statModifiers: [Items.PreemBarrelModRecoil_inline2]

Items.PreemBarrelModRecoilY_inline1:
  $base: Items.HitmanNovaWeaponMod_inline0
  statType: BaseStats.RecoilEnableLinearX
  value: 0.0

Items.PreemBarrelModRecoilY_inline2:
  $base: Items.HitmanNovaWeaponMod_inline0
  statType: BaseStats.RecoilEnableLinearXADS
  value: 0.0

Items.PreemBarrelModRecoilY:
  $base: Items.SimpleWeaponMod01
  placementSlots: [AttachmentSlots.PreemBarrelMod01, AttachmentSlots.PreemBarrelMod02]
  statModifiers: [Items.PreemBarrelModRecoilY_inline1, Items.PreemBarrelModRecoilY_inline2]

Items.PreemBarrelModTurbo_inline1:
