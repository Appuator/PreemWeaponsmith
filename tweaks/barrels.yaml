  placementSlots: [AttachmentSlots.PreemBarrelMod01, AttachmentSlots.PreemBarrelMod02]
  statModifiers: [Items.PreemBarrelModTurboCharge_inline3]

# Charge time x2.0 (Phase 2 gate decision, as Turbo Charge above).
